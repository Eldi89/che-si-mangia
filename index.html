          <button class="ico" data-act="swap" data-i="${i}" data-m="${m}" aria-label="Cambia">🔄</button>
        </div>`;}).join("")}
    </div>`;}).join("")}
  <p class="note">🔒 blocca i piatti che ti piacciono: “Nuovo menu” cambia solo gli altri. Il menu usa i filtri della scheda Idea, con pranzi più veloci e al massimo una ricetta impegnativa.</p>`;
}

/* ---------- shopping list ---------- */
function shopData(){
  const map = new Map();
  S.week.days.forEach(d=>["p","c"].forEach(m=>{
    if(!d[m]) return; const r = BY_ID[d[m].id];
    r.i.forEach(x=>{
      const [q,name] = x.split("|"); const key = name.toLowerCase();
      if(!map.has(key)) map.set(key,{name, qs:[], pantry: PANTRY.has(key) || q==="olio" || q.startsWith("olio per")});
      if(q && q!=="q.b." && !q.startsWith("olio")) map.get(key).qs.push(q);
    });
  }));
  map.forEach(x => x.qs = sumQty(x.qs));
  const all = [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,"it"));
  return {buy: all.filter(x=>!x.pantry), pantry: all.filter(x=>x.pantry)};
}
function sumQty(qs){
  // "5 spicchi" + "2 spicchi" -> "7 spicchi"; "1/2" + "1" -> "1 ½"; ranges and free text stay as they are
  const units = new Map(), other = [];
  qs.forEach(q => {
    const m = q.match(/^(\d+\/\d+|\d+(?:[.,]\d+)?)(?:\s+(.*))?$/);
    if(!m){ other.push(q); return; }
    const n = m[1].includes("/") ? m[1].split("/").reduce((a,b)=>a/b) : parseFloat(m[1].replace(",","."));
    const u = m[2] || "";
    units.set(u, (units.get(u)||0) + n);
  });
  const fmt = n => { const w = Math.floor(n), f = Math.round((n-w)*4)/4; const fr = {0.25:"¼",0.5:"½",0.75:"¾"}[f]||""; return (w?String(w):"") + (w&&fr?" ":"") + fr || "0"; };
  return [...[...units].map(([u,n]) => (fmt(n)+" "+u).trim()), ...other];
}
function shopSheet(){
  const {buy,pantry} = shopData();
  const line = x => `<label><input type="checkbox" data-act="shopck" data-k="${esc(x.name)}" ${S.shop[x.name]?"checked":""}><span>${esc(x.name)}</span><span class="q">${esc(x.qs.join(" + "))}</span></label>`;
  return `<div class="wrap">
    <h2 style="margin-top:4px">🛒 Lista della spesa</h2>
    <p class="sub">Per i 10 piatti della settimana, dosi per 2 persone.</p>
    <div class="card ing">${buy.map(line).join("")}</div>
    <h3>Probabilmente già in dispensa</h3>
    <div class="card ing">${pantry.map(line).join("")}</div>
    <div class="row" style="margin-top:16px">
      <button class="btn ghost" data-act="shopclear">Deseleziona tutto</button>
      <button class="btn primary" data-act="shopshare">Condividi lista</button>
    </div></div>`;
}
async function shareShop(){
  const {buy} = shopData();
  const txt = "Lista spesa (Che Si Mangia?)\n" + buy.filter(x=>!S.shop[x.name]).map(x=>`• ${x.name}${x.qs.length?" ("+x.qs.join(" + ")+")":""}`).join("\n");
  try{
    if(navigator.share){ await navigator.share({text:txt}); return; }
    await navigator.clipboard.writeText(txt); toast("Lista copiata");
  }catch(e){ if(e && e.name!=="AbortError"){ try{ await navigator.clipboard.writeText(txt); toast("Lista copiata"); }catch(_){ toast("Impossibile condividere"); } } }
}

/* ---------- recipes ---------- */
function viewRecipes(){
  const q = S.q.trim().toLowerCase();
  const list = RECIPES.filter(r =>
    (S.rc==="all" || r.c===S.rc) && (!S.onlyFav || S.favs.has(r.id)) &&
    (!q || r.n.toLowerCase().includes(q) || r.i.some(x=>x.split("|")[1].toLowerCase().includes(q)))
  ).sort((a,b)=>a.n.localeCompare(b.n,"it"));
  return `
  <p class="sub">${RECIPES.length} classici facili da fare a casa. Cerca per nome o ingrediente.</p>
  <input class="search" id="q" type="search" placeholder="Es. pollo, ceci, carbonara…" value="${esc(S.q)}" autocomplete="off">
  <div class="scroll-x" style="margin-top:12px">
    <button class="chip ${S.onlyFav?"on":""}" data-act="onlyfav">❤️ Preferiti</button>
    <button class="chip ${S.rc==="all"?"on":""}" data-act="rc" data-v="all">Tutte</button>
    ${Object.entries(CUISINES).map(([k,c])=>`<button class="chip ${S.rc===k?"on":""}" data-act="rc" data-v="${k}">${c.e} ${c.l}</button>`).join("")}
  </div>
  <div class="card list" style="margin-top:12px" id="rlist">${recipeRows(list)}</div>`;
}
function recipeRows(list){
  if(!list.length) return `<div class="empty">Nessuna ricetta trovata.</div>`;
  return list.map(r=>`<button class="item" data-act="open" data-id="${r.id}">
    <span class="flag">${CUISINES[r.c].e}</span>
    <span style="flex:1;min-width:0"><div class="n">${esc(r.n)}${S.favs.has(r.id)?" ❤️":""}</div>
    <small>${DIFF[r.d]} · ${fmtTime(r.t)} · ${r.m==="pc"?"Pranzo o cena":mealLbl(r.m)}</small></span>
    ${dots(r.d)}</button>`).join("");
}

function recipeSheet(id){
  const r = BY_ID[id];
  const slots = S.week ? S.week.days.flatMap((d,i)=>["p","c"].map(m=>`<option value="${i}|${m}">${DAYS[i]} · ${mealLbl(m)}</option>`)).join("") : "";
  return `<div class="wrap">
    <div class="rhead">
      <div class="kicker" style="font-size:13px;color:var(--muted)">${CUISINES[r.c].e} ${CUISINES[r.c].l} · ${r.m==="pc"?"Pranzo o cena":mealLbl(r.m)}</div>
      <div class="name">${esc(r.n)}</div>
      <p style="margin:0 0 10px">${esc(r.s)}</p>
      <div class="meta">${dots(r.d)} ${DIFF[r.d]} <span>⏱ ${fmtTime(r.t)}</span><span>👥 per 2 persone</span></div>
    </div>
    <div class="row" style="margin-top:16px">
      <button class="btn ghost" data-act="fav" data-id="${r.id}">${S.favs.has(r.id)?"❤️ Preferito":"🤍 Preferito"}</button>
      <button class="btn ghost" data-act="cooked" data-id="${r.id}">${S.cooked[r.id]?"✓ Cucinato":"👨‍🍳 L'ho cucinato"}</button>
    </div>
    <h3>Ingredienti</h3>
    <div class="card ing">${r.i.map(x=>{ const [q,n]=x.split("|"); return `<label><input type="checkbox"><span>${esc(n)}</span><span class="q">${esc(q)}</span></label>`; }).join("")}</div>
    <h3>Procedimento</h3>
    <ol class="steps">${r.p.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
    ${slots?`<h3>Metti nel menu della settimana</h3>
    <div class="row"><select class="mini" id="slotSel">${slots}</select><button class="btn primary" data-act="toweek" data-id="${r.id}">Aggiungi</button></div>`:""}
  </div>`;
}

/* ---------- places ---------- */
function viewOut(){
  const hoods = ["Tutti", ...new Set(PLACES.map(p=>p.hood))];
  const list = PLACES.filter(p => S.hood==="Tutti" || p.hood===S.hood);
  const cats = Object.keys(PLACE_CATS).filter(c => list.some(p=>p.cat===c));
  const want = PLACES.filter(p=>S.want.has(p.n));
  return `
  <p class="sub">Quando non hai voglia di cucinare: 2 posti per cucina e 2 bar, tra West Village, SoHo, Nolita, East Village e Lower East Side. Selezione basata sulle recensioni di The Infatuation.</p>
  <div class="scroll-x">${hoods.map(h=>`<button class="chip ${S.hood===h?"on":""}" data-act="hood" data-v="${esc(h)}">${esc(h)}</button>`).join("")}</div>
  ${want.length && S.hood==="Tutti" ? `<h2>⭐ Da provare</h2>${want.map(placeCard).join("")}` : ""}
  ${cats.map(c=>`<h2>${PLACE_CATS[c].e} ${PLACE_CATS[c].l}</h2>${list.filter(p=>p.cat===c).map(placeCard).join("")}`).join("")}
  ${!list.length?`<div class="card empty">Nessun posto in questa zona.</div>`:""}
  <p class="note">Selezione aggiornata a ${esc(PLACES_UPDATED)}. Locali e orari cambiano spesso: controlla prima di andare e prenota quando puoi.</p>`;
}
function placeCard(p){
  const maps = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(p.n + " " + (p.addr||"") + " New York NY");
  return `<div class="card place">
    <div class="top"><div><div class="n">${esc(p.n)}</div><div class="where">📍 ${esc(p.hood)}${p.addr?" · "+esc(p.addr):""}</div></div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">${p.rating?`<span class="badge">${esc(p.rating)}</span>`:""}<span style="font-size:13px;color:var(--muted)">${esc(p.price||"")}</span></div></div>
    <div class="why">${esc(p.why)}</div>
    ${p.order?`<div class="order">🍽️ <b>Da ordinare:</b> ${esc(p.order)}</div>`:""}
    ${p.tip?`<div class="where" style="margin-top:8px">💡 ${esc(p.tip)}</div>`:""}
    <div class="acts">
      <a href="${maps}" target="_blank" rel="noopener">🗺️ Mappa</a>
      ${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener">📰 Recensione</a>`:""}
      <button class="ico ${S.want.has(p.n)?"on":""}" style="border:1px solid var(--line);width:44px;height:auto;border-radius:12px" data-act="want" data-v="${esc(p.n)}" aria-label="Da provare">${S.want.has(p.n)?"⭐":"☆"}</button>
    </div></div>`;
}

/* ---------- render ---------- */
function render(){
  const v = {idea:viewIdea, week:viewWeek, recipes:viewRecipes, out:viewOut}[S.tab] || viewIdea;
  $("#view").innerHTML = v();
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===S.tab));
  const q = $("#q");
  if(q) q.addEventListener("input", e => {
    S.q = e.target.value;
    const ql = S.q.trim().toLowerCase();
    const list = RECIPES.filter(r => (S.rc==="all"||r.c===S.rc) && (!S.onlyFav||S.favs.has(r.id)) && (!ql || r.n.toLowerCase().includes(ql) || r.i.some(x=>x.split("|")[1].toLowerCase().includes(ql)))).sort((a,b)=>a.n.localeCompare(b.n,"it"));
    $("#rlist").innerHTML = recipeRows(list);
  });
}
let sheetMode = null;
function openSheet(html, mode){ sheetMode = mode; const s = $("#sheet"); s.innerHTML = `<div class="grab"></div><button class="close" data-act="close" aria-label="Chiudi">✕</button>` + html; s.scrollTop = 0; s.classList.add("open"); $("#sheetBg").classList.add("open"); }
function closeSheet(){ $("#sheet").classList.remove("open"); $("#sheetBg").classList.remove("open"); sheetMode = null; }
function refreshSheet(){ if(sheetMode && sheetMode.startsWith("r:")){ const top=$("#sheet").scrollTop; openSheet(recipeSheet(sheetMode.slice(2)), sheetMode); $("#sheet").scrollTop=top; } }

document.addEventListener("click", e => {
  const tabBtn = e.target.closest("nav.tabs button");
  if(tabBtn){ S.tab = tabBtn.dataset.tab; save(); render(); window.scrollTo(0,0); return; }
  if(e.target.id==="sheetBg"){ closeSheet(); return; }
  const el = e.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  const f = S.filters;
  switch(a){
    case "meal": S.meal = v; newIdea(); render(); break;
    case "again": newIdea(); render(); break;
    case "open": openSheet(recipeSheet(id), "r:"+id); break;
    case "close": closeSheet(); break;
    case "fav": S.favs.has(id) ? S.favs.delete(id) : S.favs.add(id); save(); render(); refreshSheet(); break;
    case "cooked": if(S.cooked[id]) delete S.cooked[id]; else { S.cooked[id] = Date.now(); toast("Buon appetito! 🍽️"); } save(); refreshSheet(); render(); break;
    case "fc": { const i = f.cuisines.indexOf(v); i>=0 ? f.cuisines.splice(i,1) : f.cuisines.push(v); if(!f.cuisines.length){ f.cuisines.push(v); toast("Lascia almeno una cucina"); } save(); newIdea(); render(); $(".filters").open = true; break; }
    case "fd": { const d = +v, i = f.diff.indexOf(d); i>=0 ? f.diff.splice(i,1) : f.diff.push(d); if(!f.diff.length){ f.diff.push(d); toast("Lascia almeno una difficoltà"); } save(); newIdea(); render(); $(".filters").open = true; break; }
    case "ft": f.time = +v; save(); newIdea(); render(); $(".filters").open = true; break;
    case "freset": S.filters = {cuisines:Object.keys(CUISINES),diff:[1,2,3],time:0}; save(); newIdea(); render(); break;
    case "regen": genWeek(true); render(); toast("Nuovo menu pronto"); break;
    case "lock": { const sl = S.week.days[+el.dataset.i][el.dataset.m]; sl.lock = !sl.lock; save(); render(); break; }
    case "swap": swapSlot(+el.dataset.i, el.dataset.m); render(); break;
    case "shop": openSheet(shopSheet(), "shop"); break;
    case "shopck": S.shop[el.dataset.k] = el.checked; save(); break;
    case "shopclear": S.shop = {}; save(); openSheet(shopSheet(), "shop"); break;
    case "shopshare": shareShop(); break;
    case "toweek": { const [i,m] = $("#slotSel").value.split("|"); S.week.days[+i][m] = {id, lock:true}; S.shop = {}; save(); render(); toast(`Aggiunto: ${DAYS[+i]} · ${mealLbl(m)}`); break; }
    case "rc": S.rc = v; render(); break;
    case "onlyfav": S.onlyFav = !S.onlyFav; render(); break;
    case "hood": S.hood = v; render(); break;
    case "want": S.want.has(v) ? S.want.delete(v) : S.want.add(v); save(); render(); break;
  }
});
document.addEventListener("keydown", e => { if(e.key==="Escape") closeSheet(); });

$("#ver").textContent = "v" + VERSION;
$("#foot").textContent = `Che Si Mangia? · versione ${VERSION}`;
render();
</script>
</body>
</html>
